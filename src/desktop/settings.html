<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title data-i18n="settings">设置</title><style>
*{box-sizing:border-box}body{margin:0;font:13px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;color:#343434;background:white;height:100vh;display:grid;grid-template-columns:188px minmax(0,1fr);overflow:hidden}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #e5e5e5;background:white;border-radius:7px;padding:7px 12px}button:hover{background:#ededed}:focus-visible{outline:2px solid #6e8dae;outline-offset:3px}aside{background:#f5f5f5;padding:24px 12px;overflow:auto;border-right:1px solid #ededed}#back{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:7px 10px;margin:0 0 25px;width:100%;text-align:left}.sidebar-caption{padding:0 10px;color:#929292;font-size:11px;margin-bottom:9px}nav{display:flex;flex-direction:column;gap:3px}nav button{display:flex;align-items:center;gap:9px;text-align:left;border:0;background:transparent;padding:9px 10px;white-space:normal}nav button[aria-selected=true]{background:#e8e8e8;color:#222}nav svg,#back svg{flex:none}main{padding:30px 30px 40px;overflow:auto;min-width:0}section{max-width:760px;margin:auto}h1{font-size:21px;font-weight:550;margin:0 0 12px}h2{font-size:13px;font-weight:550;margin:28px 0 10px}.description{margin:0 0 22px;color:#888}label{display:block}input,select{width:100%;padding:8px 10px;border:1px solid #dedede;border-radius:7px;background:white;min-width:0}small,p{color:#888;line-height:1.6}p{overflow-wrap:anywhere}.card{border:1px solid #e6e6e6;border-radius:12px;padding:0 16px;margin-top:16px}.setting-row{display:flex;gap:20px;align-items:center;padding:16px 0}.setting-row+.setting-row{border-top:1px solid #ededed}.setting-copy{flex:1;min-width:0}.setting-copy label{font-weight:500}.setting-copy p{font-size:11px;margin:4px 0 0}.setting-row>input,.setting-row>select{width:48%;max-width:280px;flex:none}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.primary{background:#343434;color:white;border-color:#343434}.primary:hover{background:#444}#notice{color:#a34738;margin:0 0 12px}#notice:empty{display:none}#workspace-path{font-size:12px;margin:6px 0 0}.entry{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid #ededed}.entry span{flex:1;overflow-wrap:anywhere}.entry button{flex:none}.switch{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 34px;width:34px;height:20px;border:0;border-radius:20px;background:#c6c8ca;padding:0;cursor:pointer;transition:background .15s}.switch:after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:white;border-radius:50%;box-shadow:0 1px 2px #0002;transition:transform .15s}.switch:checked{background:#4979bd}.switch:checked:after{transform:translateX(14px)}.switch:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}@media(max-width:720px){body{grid-template-columns:165px minmax(0,1fr)}main{padding:24px 20px}.setting-row{gap:12px}.card{padding:0 12px}}@media(prefers-reduced-motion:reduce){.switch,.switch:after{transition:none}}

#tools .card{padding:20px;margin:16px 0 24px}#tools .card h2{margin:0;font-size:15px;color:#303030}#tools .card p{margin:12px 0;color:#727272}#tools .card .actions{margin-top:20px;gap:10px}#tools .card .actions button{margin:0;min-height:36px}#mcp-connection[data-mcp-status=failed] [role=status]{color:#9b4938;background:#fff6f2;border-radius:8px;padding:10px 12px}#refresh-tools{margin:0 0 8px}button:disabled{cursor:default;opacity:.55}@media(max-width:720px){#tools .card{padding:16px}}
</style></head><body><aside><button id="back" data-i18n="backToApp">返回应用</button><div class="sidebar-caption" data-i18n="settings">设置</div><nav role="tablist" aria-orientation="vertical" aria-label="设置类别" data-i18n-aria-label="settingsCategories"><button role="tab" data-tab="general" aria-selected="false" data-i18n="general">常规</button><button role="tab" data-tab="model" aria-selected="true" data-i18n="model">模型</button><button role="tab" data-tab="workspace" aria-selected="false" data-i18n="defaultSpace">默认空间</button><button role="tab" data-tab="approval" aria-selected="false" data-i18n="approval">审批</button><button role="tab" data-tab="tools" aria-selected="false" data-i18n="tools">工具</button><button role="tab" data-tab="memory" aria-selected="false" data-i18n="memory">记忆</button><button role="tab" data-tab="hidden" aria-selected="false" data-i18n="visibility">会话显示</button></nav></aside><main><p id="notice" role="status"></p>
<section id="general" role="tabpanel" hidden><h1 data-i18n="general">常规</h1><div class="card"><div class="setting-row"><div class="setting-copy"><label for="language" data-i18n="language">语言</label><p data-i18n="languageHelp">选择应用界面语言。不会更改对话、文件或正在执行的任务。</p></div><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></div></div></section><section id="model" role="tabpanel"><h1 data-i18n="modelService">模型服务</h1><p class="description" data-i18n="modelHelp">选择服务商与模型，配置用于执行任务的连接。</p><form id="model-form"><div class="card"><div class="setting-row"><div class="setting-copy"><label for="provider" data-i18n="provider">服务商</label></div><select id="provider"></select></div><div class="setting-row"><div class="setting-copy"><label for="preset" data-i18n="preset">预置模型</label></div><select id="preset"></select></div><div class="setting-row"><div class="setting-copy"><label for="model-id" data-i18n="modelId">模型 ID</label><p data-i18n="customModelHelp">也可以填写服务商支持的自定义模型。</p></div><input id="model-id" required></div><div class="setting-row"><div class="setting-copy"><label for="api-key">API Key</label><p id="key-status"></p></div><input id="api-key" type="password" autocomplete="off"></div></div><div class="actions"><button class="primary" data-i18n="saveConfig">保存配置</button><button type="button" id="delete-model" data-i18n="deleteConfig">删除配置</button></div></form></section>
<section id="workspace" role="tabpanel" hidden><h1 data-i18n="defaultWorkspace">默认工作空间</h1><p class="description" data-i18n="defaultHelp">用于以后创建的 Bot 和群组。已有项目的空间固定，不随此处改变。</p><div class="card"><div class="setting-row"><div class="setting-copy"><label data-i18n="defaultFolder">默认文件夹</label><p id="workspace-path"></p></div><button id="choose-workspace" data-i18n="change">更改</button></div><div class="setting-row"><div class="setting-copy"><label for="output-dir" data-i18n="outputFolder">产出文件夹</label><p data-i18n="relativePath">工作空间内的相对路径。</p></div><input id="output-dir"></div></div><div class="actions"><button id="save-output-dir" data-i18n="saveOutput">保存产出位置</button><button id="forget-workspace" data-i18n="forgetDefault">忘记默认空间并撤销授权</button></div></section>
<section id="approval" role="tabpanel" hidden><h1 data-i18n="approvalRules">审批规则</h1><p class="description" data-i18n="approvalHelp">查看已保存的规则。删除后，相应操作将重新按默认规则确认。</p><div id="approval-list"></div></section><section id="memory" role="tabpanel" hidden><h1 data-i18n="longMemory">长期记忆</h1><p class="description" data-i18n="memoryHelp">查看与删除已保存的会话记忆。</p><div id="memory-list"></div></section><section id="hidden" role="tabpanel" hidden><h1 data-i18n="visibility">会话显示</h1><p class="description" data-i18n="visibilityHelp">控制 Bot 与群组是否在侧栏显示。关闭显示会保留原有记录。</p><div id="hidden-list"></div></section>
<section id="tools" role="tabpanel" hidden><h1 data-i18n="tools">工具</h1><p data-i18n="toolsHelp">查看本机工具，当前仅发现，尚未启用。</p><div id="mcp-connection" class="card"></div><button id="refresh-tools" data-i18n="scanTools">重新扫描</button><p id="tool-feedback" role="status" style="color:inherit"></p><div id="tools-list"></div><details><summary data-i18n="scanSources">扫描范围与结果</summary><div id="tool-sources"></div></details></section></main><script src="settings-renderer.js"></script></body></html>
